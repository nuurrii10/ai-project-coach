services:
  database:
    image: postgres:17
    container_name: ai-project-coach-db

    environment:
      POSTGRES_DB: projectcoach
      POSTGRES_USER: projectcoach
      POSTGRES_PASSWORD: projectcoach

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: