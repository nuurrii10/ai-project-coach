spring.application.name=ai-project-coach

spring.datasource.url=${DB_URL:jdbc:h2:mem:projectcoach;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Gemini API configuration
gemini.api.key=${GEMINI_API_KEY:dev-placeholder}
gemini.api.model=${GEMINI_API_MODEL:gemini-2.5-flash}
