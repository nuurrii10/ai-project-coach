
# Application
spring.application.name=ai-project-coach

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5433/projectcoach
spring.datasource.username=projectcoach
spring.datasource.password=projectcoach
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:dev-placeholder}
gemini.api.model=${GEMINI_API_MODEL:gemini-2.5-flash}
