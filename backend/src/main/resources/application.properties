
# Application
spring.application.name=ai-project-coach

# Local H2 default; override with environment variables for an external database.
spring.datasource.url=${DB_URL:jdbc:h2:mem:projectcoach;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:dev-placeholder}
gemini.api.model=${GEMINI_API_MODEL:gemini-2.5-flash}
