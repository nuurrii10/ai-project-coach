# Test configuration: replaces src/main/resources/application.properties during tests,
# so tests run with an in-memory H2 database and don't need Docker/PostgreSQL.
spring.application.name=ai-project-coach

spring.datasource.url=jdbc:h2:mem:projectcoach;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

gemini.api.key=dev-placeholder
gemini.api.model=gemini-2.5-flash
